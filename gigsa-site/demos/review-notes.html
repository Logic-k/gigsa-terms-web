<style>
:root{--bg:#f6f7fb;--ink:#1c2333;--sub:#5b6478;--line:#e3e7f0;--blue:#2f5fd0;--blue-bg:#eef3fe;--red:#c9403f;--red-bg:#fdeeee;--green:#2c8a5b;--green-bg:#eaf6f0;--amber:#b47409;--amber-bg:#fdf5e4;--purple:#7048b6;--purple-bg:#f3eefb;--teal:#0f7f8b;--teal-bg:#e8f6f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:14.5px}
header{background:linear-gradient(120deg,#1d2c56,#0f7f8b);color:#fff;padding:22px 16px;text-align:center}
header h1{font-size:20px}
header p{opacity:.85;font-size:12.5px;margin-top:5px}
.wrap{max-width:900px;margin:0 auto;padding:14px 12px 70px}
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px}
#q{width:100%;padding:11px 14px;border:2px solid var(--blue);border-radius:11px;font-size:15px;font-family:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs button .n{opacity:.75;font-weight:600;font-size:11.5px}
#stat{font-size:12px;color:var(--sub);margin:8px 2px 2px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 4px rgba(20,30,60,.04)}
.card h3{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sb{font-size:11px;font-weight:800;padding:2px 9px;border-radius:12px;flex-shrink:0}
.s1{background:var(--blue-bg);color:var(--blue)}.s2{background:var(--green-bg);color:var(--green)}.s3{background:var(--purple-bg);color:var(--purple)}.s4{background:var(--amber-bg);color:var(--amber)}.s5{background:var(--red-bg);color:var(--red)}
.card ul{margin:2px 0 4px 18px}
.card li{margin:2.5px 0;font-size:13.8px}
.kw{margin-top:7px}
.kw span{display:inline-block;background:#f0f3fa;border-radius:7px;padding:1px 8px;font-size:11.5px;color:var(--sub);margin:2px 3px 0 0}
.src{font-size:10.5px;color:#a8b0c2;margin-top:5px}
.none{text-align:center;color:var(--sub);padding:40px 0}
mark{background:#ffe9a8;border-radius:3px;padding:0 1px}
</style>
</head>

const tabs=document.getElementById('tabs'),list=document.getElementById('list'),q=document.getElementById('q'),stat=document.getElementById('stat');
let cur=0;
function counts(){const c={0:D.length};for(const d of D)c[d.s]=(c[d.s]||0)+1;return c}
function renderTabs(){const c=counts();let h=`<button class="${cur===0?'on':''}" data-s="0">전체 <span class="n">${c[0]}</span></button>`;
for(let s=1;s<=5;s++)h+=`<button class="${cur===s?'on':''}" data-s="${s}">${SUBJ[s]} <span class="n">${c[s]||0}</span></button>`;tabs.innerHTML=h}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hl(t,w){if(!w)return esc(t);const i=t.toLowerCase().indexOf(w.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+w.length))+'</mark>'+esc(t.slice(i+w.length))}
function render(){const w=q.value.trim();let items=D.filter(d=>(cur===0||d.s===cur));
if(w)items=items.filter(d=>(d.t+' '+d.c+' '+d.k.join(' ')).toLowerCase().includes(w.toLowerCase()));
stat.textContent=`${items.length}개 카드${w?` — "${w}" 검색 결과`:''}`;
if(!items.length){list.innerHTML='<p class="none">검색 결과가 없습니다</p>';return}
list.innerHTML=items.map(d=>{
 const bullets=d.c.split(' ·').map(x=>x.replace(/^·/,'').trim()).filter(Boolean);
 return `<div class="card"><h3><span class="sb s${d.s}">${SUBJ[d.s].split(' ')[0]}</span>${hl(d.t,w)}</h3>
 <ul>${bullets.map(b=>'<li>'+hl(b,w)+'</li>').join('')}</ul>
 <div class="kw">${d.k.map(x=>'<span>'+esc(x)+'</span>').join('')}</div>
 <div class="src">원본 캡처: ${SRC[d.f]||d.f}</div></div>`}).join('')}
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.s;renderTabs();render();window.scrollTo({top:0})});
q.addEventListener('input',render);
renderTabs();render();
</script>
